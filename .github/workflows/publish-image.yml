name: Publish course image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.platform }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=elec3441-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=elec3441-${{ matrix.suffix }}

      - name: Verify ${{ matrix.platform }} image and released materials
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.suffix }}"
          docker pull "$image"
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/student-materials,target=/workspace,readonly" \
            "$image" verify-setup

  publish:
    name: Assemble multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and inspect image
        id: manifest
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          amd64="${image}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64"
          arm64="${image}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm64"
          release="${image}:${GITHUB_REF_NAME}"

          docker buildx imagetools create \
            --tag "$release" \
            --tag "${image}:latest" \
            "$amd64" \
            "$arm64"

          docker buildx imagetools inspect "$release"
          digest=$(docker buildx imagetools inspect "$release" | awk '/^Digest:/ {print $2; exit}')
          test -n "$digest"

          echo "## Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${image}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
